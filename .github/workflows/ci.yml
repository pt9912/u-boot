name: ci

# CI-Pipeline gemäß LH-QA-003 / ADR-0004 / ADR-0007 (image-scan via
# slice-v1-release-pipeline T3).
#
# Drei parallele Jobs (analog k-deskflight ADR 0012 §2.11, erweitert):
#   - gates           : Inner-Loop-Pflichten (lint + test + coverage-gate) — `make gates`.
#   - security-gates  : govulncheck — `make govulncheck`.
#   - image-scan      : Trivy HIGH+CRITICAL gegen das Runtime-Image — `make image-scan` lokal.
#
# Alle drei Jobs sind PR-blockierend. Required-Status-Checks werden im
# GitHub-UI nach dem ersten grünen Lauf konfiguriert (Settings →
# Branches → Branch protection rules → `main`); die exakten Display-
# Namen sind die verbose `name:`-Felder der Jobs, nicht die kurzen
# `jobs.<key>`-Identifier (siehe `docs/maintainer/branch-protection.md`).
#
# Docker-only-Pfad (LH-FA-BUILD-007, ADR-0043): der `gates`-Job baut das
# Devcontainer-Image (`docker build -f .devcontainer/Dockerfile .devcontainer`,
# Kontext je Messbasis M1) und ruft `make gates` in einem privilegierten
# `docker run` des Images auf (Muster je Messbasis M3; der verschachtelte
# Daemon des Containers trägt die Container-Züge von `docs-check`). Der Runner
# installiert keine Go-Toolchain — er braucht nur das vorinstallierte Docker +
# BuildKit auf `ubuntu-latest`. Die Sockelform-Züge (`test-docker` im
# Workflow `integration-docker`) laufen am Runner-Docker ohne diesen Container.
#
# Action-Pinning (Supply-Chain-Härtung): alle `uses:`-Einträge sind
# SHA-gepinnt mit Tag-Kommentar. Pin-Hebung ist Routine; neuen Commit-
# SHA via `gh api repos/<owner>/<repo>/git/refs/tags/<tag>` auflösen
# und Tag-Kommentar mitführen.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Top-level permissions: explizit alles entziehen. Jeder Job lockert
# auf das, was er braucht (Defense-in-Depth gegen versehentlich neu
# hinzukommende Steps, die schreibende Tokens nutzen würden).
permissions: {}

jobs:
  gates:
    name: gates (lint + test + coverage-gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DOCKER_BUILDKIT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build the devcontainer image
        run: docker build --tag u-boot-devcontainer:ci -f .devcontainer/Dockerfile .devcontainer

      # Der Arbeits-Schritt je Messbasis M3: die containerEnv der
      # .devcontainer/devcontainer.json als docker-run-Optionen nachgebaut (die
      # bare `docker run`-Form übernimmt sie nicht), dann die Startscript-Fahrt
      # (docker-init), die Daemon-Wartezeit und das safe.directory der
      # Bind-Mount-Form vor `make gates`. Der Bind-Mount des Runner-Workspaces
      # gehört auf dem Runner dem Job-Benutzer (uid 1001); der Container läuft
      # als uid 1000 (vscode) — ohne die Übertragung des Eigentums bricht der
      # erste Schreibzugriff im Bind-Mount (Go-Caches, Coverage-Ausgabe,
      # record-gates-Stempel).
      - name: Run make gates in the devcontainer container
        run: |
          mkdir -p .cache/go-build .cache/go-mod
          sudo chown -R 1000:1000 "$PWD"
          docker run --rm --privileged \
            --volume u-boot-devcontainer-docker:/var/lib/docker \
            --volume "$PWD:/workspaces/u-boot" \
            --workdir /workspaces/u-boot \
            --env GOTOOLCHAIN=local \
            --env 'GOFLAGS=-mod=readonly -buildvcs=false' \
            --env GOCACHE=/workspaces/u-boot/.cache/go-build \
            --env GOMODCACHE=/workspaces/u-boot/.cache/go-mod \
            u-boot-devcontainer:ci \
            bash -c 'set -euo pipefail; \
              sudo sh /usr/local/bin/u-boot-docker-init >/tmp/docker-init.log 2>&1; \
              for i in $(seq 1 60); do docker info >/dev/null 2>&1 && break; sleep 1; done; \
              docker info >/dev/null; \
              git config --global --add safe.directory /workspaces/u-boot; \
              make gates'

  security-gates:
    name: security-gates (govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DOCKER_BUILDKIT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run make govulncheck
        run: make govulncheck

  image-scan:
    name: image-scan (trivy HIGH+CRITICAL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DOCKER_BUILDKIT: '1'
      # LOCAL_IMAGE muss zum `repo.mk`-Default `IMAGE ?= u-boot`
      # passen — `make build` taggt `$(IMAGE):latest` lokal, und
      # der Trivy-Scan löst das Tag über den Host-Docker-Daemon auf.
      LOCAL_IMAGE: u-boot
    # Dritter PR-blockierender Job (slice-v1-release-pipeline T3):
    # baut das Runtime-Image und scannt es mit Trivy. Lebenszyklus
    # bewusst identisch zu `gates`/`security-gates` — gleicher
    # Trigger, gleiche Branch-Protection-Aufnahme. Eigener Workflow
    # wäre ein zweiter Lebenszyklus für ein Defense-in-Depth-Tool,
    # das ohnehin auf dem `make build`-Artefakt aufsetzt.
    #
    # Default-Severity-Schwelle gemäß slice-AC: HIGH und CRITICAL
    # brechen den Build. Findings ohne verfügbaren Fix werden
    # bewusst nicht ignoriert; Auswertung pro Finding statt
    # Sammel-Carveout.
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build runtime image
        run: make build

      - name: Trivy scan (image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          image-ref: '${{ env.LOCAL_IMAGE }}:latest'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          format: 'table'
          # Trivy-Version explizit pinnen statt sich auf den
          # Action-Default zu verlassen — repo.mk-Default
          # `TRIVY_VERSION ?= 0.70.0` muss dem hier matchen,
          # damit `make image-scan` lokal denselben Detector-Code-
          # Pfad nimmt wie der CI-Job (Inner-/Outer-Loop-Parität).
          #
          # ACHTUNG Format-Spaltung: hier GitHub-Release-Tag MIT
          # `v`-Prefix (`v0.70.0`), in repo.mk Docker-Hub-Tag OHNE
          # `v`-Prefix (`0.70.0`). Beim Pin-Bump beide synchron auf
          # die gleiche Version in der jeweils richtigen Schreibweise.
          #
          # Die Eingabe heißt `version` (action.yaml der oben gepinnten
          # Action); ein unbekannter Eingabename erzeugt im Lauf nur die
          # Annotation „Unexpected input(s)“, und es gilt der Default der
          # Action.
          version: 'v0.70.0'
